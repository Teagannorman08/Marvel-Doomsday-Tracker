<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOMSDAY — Marvel Watch Tracker</title>
<style>
:root{--bg:#0a0a0a;--text:#e8e8e8;--muted:#999;--red:#e62429;--green:#20a464;--line:#1a1a1a;--card:#121212}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#000;color:var(--text);line-height:1.5}
header{background:linear-gradient(180deg,#1a0505 0%,transparent 100%);padding:32px 24px 24px;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:900;letter-spacing:.15em;margin-bottom:20px}.brand span{color:var(--red)}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;max-width:600px}
.timer-box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.timer-box .value{font-size:28px;font-weight:900;color:var(--red)}
.timer-box .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px}
nav{position:sticky;top:0;z-index:100;background:#0a0a0a;border-bottom:1px solid var(--line);backdrop-filter:blur(10px):-webkit-backdrop-filter:blur(10px)}
.nav{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:16px}
.tab{padding:14px 0;border:none;background:none;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:24px}
.toolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;margin-bottom:24px;align-items:center}
.search-box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--text);font-size:13px}
.search-box::placeholder{color:var(--muted)}
.select-box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;cursor:pointer}
.stats{display:flex;gap:24px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:24px}
.stat-item{flex:1}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:18px;font-weight:800;color:var(--text)}
.progress-bar{width:100%;height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.progress-bar-fill{height:100%;background:var(--red);transition:width .3s}
.grid{display:grid;gap:12px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;transition:all .2s}
.card:hover{border-color:var(--red);background:#161616}
.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.card-title{font-size:15px;font-weight:800;color:var(--text)}
.card-meta{font-size:12px;color:var(--muted);margin-top:6px}
.card-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:8px 14px;background:var(--line);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;white-space:nowrap}
.btn:hover{background:#222}
.btn.expand{padding:8px 10px}
.btn.done{background:var(--green);border-color:var(--green);color:#000}
.episodes{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.card.open .episodes{display:grid}
.ep-item{display:flex;gap:8px;align-items:center;font-size:13px}
.ep-item input{cursor:pointer}
.ep-item label{cursor:pointer;flex:1}
.ep-item label:hover{color:var(--red)}
.schedule{display:grid;gap:16px;margin-top:20px}
.day-block{background:var(--card);border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:16px}
.day-header{font-weight:700;font-size:13px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.day-time{font-size:12px;color:var(--muted)}
.schedule-item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px;background:#0f0f0f;border-radius:6px;font-size:13px}
.schedule-item b{color:var(--text);display:block;margin-bottom:2px}
.schedule-item .ep-name{font-size:12px;color:var(--muted)}
.hidden-list{display:grid;gap:8px}
.hidden-item{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:40px}
section{display:none}
section.active{display:block}
@media(max-width:768px){.toolbar{grid-template-columns:1fr}.timer-box .value{font-size:20px}.card-actions{flex-wrap:wrap}}
</style></head><body>
<header>
<div class="brand"><span>MARVEL</span> DOOMSDAY TRACKER</div>

</header>

<div class="nav">

</nav>

</div>
<div class="stats">

</div>
<div class="stat-item">
<div class="stat-label">Progress</div>
<div class="stat-value" id="pc">0%</div>
<div class="progress-bar"><div class="progress-bar-fill" id="pb"></div></div>
</div>
</div>
<div id="list" class="grid"></div>
</section>
<section id="schedule">
<div id="sched" class="schedule"></div>
</section>
<section id="hidden">
<div id="hiddenList" class="hidden-list"></div>
</section>
</main>
<footer>Every title in chronological order. Progress stored locally. Episode names verified or marked as TBD.</footer>

const KEY="marvel-doomsday-tracker-v6";
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||typeof S!=="object")S={watched:{},episodes:{},hidden:{}};
S.watched=S.watched&&typeof S.watched==="object"?S.watched:{};
S.episodes=S.episodes&&typeof S.episodes==="object"?S.episodes:{};
S.hidden=S.hidden&&typeof S.hidden==="object"?S.hidden:{};
localStorage.setItem(KEY,JSON.stringify(S));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const fmt=m=>m?`${Math.floor(m/60)}h ${m%60?m%60+"m":""}`:"TBD";
const hasE=x=>x.episodes.length>0;
const done=x=>hasE(x)?x.episodes.every((e,i)=>S.episodes[x.id+"-"+i]):!!S.watched[x.id];
const active=()=>DATA.filter(x=>!S.hidden[x.id]);
function stats(){
  let total=0,watched=0;
  active().forEach(x=>{
    if(hasE(x)){
      total+=x.episodes.length;
      watched+=x.episodes.filter((e,i)=>S.episodes[x.id+"-"+i]).length;
    }else{
      total++;
      if(S.watched[x.id])watched++;
    }
  });
  let p=total?Math.round(watched/total*100):0;
  document.getElementById("wc").textContent=watched;
  document.getElementById("rc").textContent=total-watched;
  document.getElementById("pc").textContent=p+"%";
  document.getElementById("pb").style.width=p+"%";
}
function render(){
  let q=document.getElementById("search").value.toLowerCase();
  let p=document.getElementById("pf").value;
  let c=document.getElementById("cf").value;
  let list=document.getElementById("list");
  list.innerHTML="";
  active().forEach(x=>{
    let d=done(x);
    if((p==="Watched"&&!d)||(p==="Unwatched"&&d)||(c!=="All"&&x.category!==c)||(q&&!x.title.toLowerCase().includes(q)&&!x.episodes.some(e=>e.toLowerCase().includes(q))))return;
    let card=document.createElement("div");
    card.className="card";
    let ep=hasE(x)?`<div class="episodes">${x.episodes.map((e,i)=>`<div class="ep-item"><input type="checkbox" id="ep${x.id}-${i}" data-i="${i}" ${S.episodes[x.id+"-"+i]?"checked":""} /><label for="ep${x.id}-${i}">${i+1}. ${e}</label></div>`).join("")}</div>`:""
    card.innerHTML=`<div class="card-header"><div><div class="card-title">${x.title}</div><div class="card-meta">${x.category} • ${x.type} • ${fmt(x.runtime)}</div></div></div>${ep}<div class="card-actions">${hasE(x)?`<button class="btn expand">Episodes</button>`:""}${hasE(x)?`<button class="btn ${done(x)?"done":""}" onclick="toggleAllEpisodes(this,'${x.id}')">Mark All</button>`:`<button class="btn ${S.watched[x.id]?"done":""}" onclick="toggleMovie(this,'${x.id}')">Watched</button>`}<button class="btn" onclick="hideTitle('${x.id}')">Hide</button></div>`;
    card.querySelector(".expand")?.addEventListener("click",()=>card.classList.toggle("open"));
    if(hasE(x)){card.querySelectorAll("[data-i]").forEach(b=>{b.onchange=()=>{S.episodes[x.id+"-"+b.dataset.i]=b.checked;save();stats();}})}
    list.appendChild(card);
  });
  stats();
}
function toggleMovie(btn,id){S.watched[id]=!S.watched[id];save();render();}
function toggleAllEpisodes(btn,id){let x=DATA.find(d=>d.id===id);let allDone=x.episodes.every((e,i)=>S.episodes[x.id+"-"+i]);x.episodes.forEach((e,i)=>S.episodes[x.id+"-"+i]=!allDone);save();render();}
function hideTitle(id){S.hidden[id]=1;save();render();renderHidden();}
function renderHidden(){
  let h=DATA.filter(x=>S.hidden[x.id]);
  let list=document.getElementById("hiddenList");
  list.innerHTML=h.map(x=>`<div class="hidden-item"><span>${x.title}</span><button class="btn" onclick="unhideTitle('${x.id}')">Unhide</button></div>`).join("");
}
function unhideTitle(id){S.hidden[id]=0;save();render();renderHidden();}
function tick(){
  let t=new Date("2026-12-18T00:00:00-07:00");
  let d=Math.max(0,t-new Date());
  let days=Math.floor(d/86400000);
  let hours=Math.floor(d%86400000/3600000);
  let minutes=Math.floor(d%3600000/60000);
  let seconds=Math.floor(d%60000/1000);
  let html=d?`<div class="timer-box"><div class="value">${days}</div><div class="label">Days</div></div><div class="timer-box"><div class="value">${hours}</div><div class="label">Hours</div></div><div class="timer-box"><div class="value">${minutes}</div><div class="label">Minutes</div></div><div class="timer-box"><div class="value">${seconds}</div><div class="label">Seconds</div></div>`:'<div style="grid-column:1/-1;text-align:center;font-size:24px;font-weight:900;color:var(--red)">DOOMSDAY IS HERE</div>';
  document.getElementById("timer").innerHTML=html;
}
setInterval(tick,1000);tick();
document.querySelectorAll(".tab").forEach(b=>{b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");}});
document.getElementById("search").oninput=render;
document.getElementById("pf").onchange=render;
document.getElementById("cf").onchange=render;
render();renderHidden();
</script>
